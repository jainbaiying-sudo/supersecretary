<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light">
    <title>團隊服務系統</title>
    <link rel="preconnect" href="https://static.line-scdn.net" crossorigin>
    <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js" defer></script>
    <style>
        :root {
            color-scheme: light;
            --blue: #4b6cb7;
            --blue-light: #829dce;
            --green: #2e7d32;
            --red: #e65c5c;
            --ink: #1f2937;
            --muted: #6b7280;
            --line: #e5e7eb;
            --page: #f3f4f6;
        }

        * { box-sizing: border-box; }
        html { background: var(--page); }
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            padding: max(16px, env(safe-area-inset-top)) 12px max(20px, env(safe-area-inset-bottom));
            background: var(--page);
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
        }

        .shell {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: #fff;
            box-shadow: 0 8px 22px rgba(15, 23, 42, .12);
        }

        .header {
            min-height: 58px;
            display: flex;
            align-items: center;
            padding: 15px 18px;
            background: linear-gradient(90deg, var(--blue), var(--blue-light));
            color: #fff;
        }

        .header h1 { margin: 0; font-size: 20px; line-height: 1.4; }
        .view { min-height: 176px; padding: 20px 18px; }
        .loading { display: grid; place-items: center; gap: 12px; min-height: 136px; color: var(--muted); text-align: center; }
        .spinner { width: 26px; height: 26px; border: 3px solid #dbe3f2; border-top-color: var(--blue); border-radius: 50%; animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .stack { display: grid; gap: 16px; }
        .notice { padding: 14px; border: 1px solid #bfdbfe; border-radius: 10px; background: #eff6ff; }
        .notice.success { border-color: #bbf7d0; background: #f0fdf4; color: #166534; }
        .notice.error { border-color: #fecaca; background: #fef2f2; color: #991b1b; }
        .notice-title { margin-bottom: 5px; font-size: 18px; font-weight: 700; }
        .muted { color: var(--muted); font-size: 14px; line-height: 1.65; }

        label { display: block; margin-bottom: 7px; font-size: 14px; font-weight: 600; }
        input {
            width: 100%;
            min-height: 48px;
            padding: 11px 12px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            background: #fff;
            color: var(--ink);
            font: inherit;
            font-size: 16px;
            outline: none;
        }
        input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(75, 108, 183, .15); }

        button {
            width: 100%;
            min-height: 48px;
            border: 0;
            border-radius: 9px;
            padding: 11px 14px;
            background: var(--blue);
            color: #fff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }
        button.share { background: var(--red); }
        button:disabled { opacity: .62; cursor: wait; }
        .status { min-height: 20px; color: #b91c1c; font-size: 14px; line-height: 1.5; }
        .status.neutral { color: var(--muted); text-align: center; }

        .tool-share-preview { padding: 4px 2px; }
        .tool-share-heading { display: flex; align-items: center; gap: 18px; margin-bottom: 24px; }
        .tool-share-copy { flex: 1; min-width: 0; }
        .tool-share-sender { margin: 0 0 12px; color: #dc5361; font-size: 15px; font-weight: 700; line-height: 1.6; overflow-wrap: anywhere; }
        .tool-share-title { margin: 0; font-size: 27px; font-weight: 800; line-height: 1.4; overflow-wrap: anywhere; }
        .tool-share-avatar { position: relative; width: 64px; height: 64px; flex: 0 0 64px; border-radius: 50%; overflow: hidden; background: #f1f3f7; display: grid; place-items: center; color: #9ca3af; font-size: 24px; font-weight: 700; }
        .tool-share-avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        .tool-share-link { display: block; padding: 13px 14px; border-radius: 9px; text-align: center; text-decoration: none; font-weight: 700; background: #81c784; color: #fff; }
        .tool-share-preview .share { margin-top: 10px; background: #ea4654; color: #fff; }
        .tool-share-brand { margin: 10px 0 0; color: #b5bac3; font-size: 11px; text-align: right; }
        .share-summary { overflow-wrap: anywhere; }
        .share-summary-link { display: inline-block; margin-top: 8px; color: #287332; }
        .share-secondary { background: #eef1f7; color: #4b5563; font-size: 14px; }
        #share-cache-notice, #share-status { overflow-wrap: anywhere; }
        #share-cache-notice { font-size: 12px; }

        body.raffle-mode {
            padding: 0;
            background: #16040d;
            color: #fff;
        }
        .raffle-mode .shell {
            max-width: 780px;
            min-height: 100vh;
            min-height: 100dvh;
            border: 0;
            border-radius: 0;
            background: #16040d;
            box-shadow: none;
        }
        .raffle-mode .header { display: none; }
        .raffle-mode .view { min-height: 100vh; min-height: 100dvh; padding: 0; }
        .raffle-app {
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 6%, rgba(255, 222, 117, .28), transparent 22%),
                radial-gradient(circle at 16% 30%, rgba(255, 62, 102, .22), transparent 23%),
                linear-gradient(180deg, #4b0718 0%, #220510 45%, #10040b 100%);
        }
        .raffle-stage {
            position: relative;
            min-height: 338px;
            padding: max(28px, env(safe-area-inset-top)) 22px 74px;
            overflow: hidden;
            text-align: center;
            isolation: isolate;
        }
        .raffle-stage::before,
        .raffle-stage::after {
            content: "";
            position: absolute;
            z-index: -1;
            top: 0;
            bottom: 18px;
            width: 34%;
            background:
                repeating-linear-gradient(90deg, rgba(255,255,255,.1) 0 10px, rgba(0,0,0,.12) 10px 24px),
                linear-gradient(90deg, #6f0718, #e01537 54%, #76051a);
            box-shadow: inset 0 0 32px rgba(0,0,0,.45), 0 12px 30px rgba(0,0,0,.35);
        }
        .raffle-stage::before { left: -9%; transform: skewX(8deg); border-radius: 0 0 78% 0; }
        .raffle-stage::after { right: -9%; transform: skewX(-8deg); border-radius: 0 0 0 78%; }
        .stage-rays {
            position: absolute;
            z-index: -2;
            inset: 0;
            background: repeating-conic-gradient(from -12deg at 50% 5%, rgba(255,231,156,.12) 0 9deg, transparent 9deg 22deg);
            mask-image: linear-gradient(#000, transparent 94%);
        }
        .stage-lights {
            position: absolute;
            inset: 12px 16%;
            border: 3px solid rgba(255, 217, 89, .82);
            border-radius: 50%;
            box-shadow: 0 0 8px #ffd759, 0 0 26px rgba(255, 193, 7, .65), inset 0 0 25px rgba(255, 193, 7, .28);
            opacity: .7;
            z-index: -1;
        }
        .stage-lights::before {
            content: "";
            position: absolute;
            inset: -8px;
            border: 2px dotted #fff2b5;
            border-radius: inherit;
        }
        .unit-plaque {
            display: inline-grid;
            gap: 4px;
            max-width: 94%;
            margin: 0 auto 16px;
            padding: 9px 16px;
            border: 2px solid #fbd56a;
            border-radius: 12px;
            background: rgba(255,255,255,.96);
            color: #641022;
            box-shadow: 0 0 0 4px rgba(255,216,102,.2), 0 8px 24px rgba(0,0,0,.3);
        }
        .unit-brand { display: flex; align-items: center; justify-content: center; gap: 5px; min-width: 0; }
        .unit-logo { width: 18px; height: 18px; flex: 0 0 18px; border-radius: 4px; object-fit: contain; }
        .unit-company { font-size: 11px; color: #7c5260; letter-spacing: .06em; }
        .unit-name { font-weight: 900; font-size: 16px; line-height: 1.35; }
        .raffle-kicker { margin: 0 0 7px; color: #ffe7a1; font-size: 13px; font-weight: 800; letter-spacing: .24em; }
        .raffle-title {
            margin: 0;
            color: #fff8d8;
            font-size: clamp(38px, 11vw, 68px);
            line-height: 1.02;
            font-weight: 950;
            letter-spacing: .03em;
            text-shadow: 0 3px 0 #b46b0b, 0 6px 0 #78101e, 0 0 22px rgba(255,211,80,.78);
        }
        .raffle-subtitle { margin: 13px auto 0; max-width: 480px; color: #ffe7e7; font-size: 14px; line-height: 1.7; }
        .stage-podium {
            position: absolute;
            left: 8%;
            right: 8%;
            bottom: 8px;
            height: 48px;
            border: 2px solid #f5b83b;
            border-radius: 50% 50% 16px 16px;
            background: linear-gradient(#ffcf47, #d46a08 58%, #8f200d);
            box-shadow: 0 -8px 26px rgba(255,191,47,.4), 0 12px 22px rgba(0,0,0,.4);
        }
        .raffle-content { position: relative; z-index: 3; margin-top: -24px; padding: 0 14px max(28px, env(safe-area-inset-bottom)); }
        .raffle-panel {
            max-width: 680px;
            margin: 0 auto 16px;
            padding: 20px;
            border: 1px solid rgba(255,222,139,.36);
            border-radius: 20px;
            background: linear-gradient(145deg, rgba(255,255,255,.98), rgba(255,245,225,.95));
            color: #321018;
            box-shadow: 0 16px 38px rgba(0,0,0,.38), inset 0 1px rgba(255,255,255,.8);
        }
        .raffle-panel-title { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; font-size: 18px; font-weight: 900; }
        .raffle-step {
            flex: 0 0 34px;
            height: 34px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: linear-gradient(145deg, #ffe88b, #d79613);
            color: #6a170d;
            box-shadow: 0 3px 0 #9a5406;
        }
        .raffle-date-grid { width: 100%; min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
        .raffle-date-grid > div { width: 100%; min-width: 0; overflow: hidden; }
        .raffle-date-grid input[type="date"] {
            display: block;
            width: 100%;
            min-width: 0;
            max-width: 100%;
            inline-size: 100%;
            max-inline-size: 100%;
            -webkit-appearance: none;
            appearance: none;
            text-align: center;
        }
        .raffle-date-grid input[type="date"]::-webkit-date-and-time-value {
            min-width: 0;
            margin: 0;
            text-align: center;
        }
        .raffle-panel label { color: #6d3340; }
        .raffle-panel input { border-color: #e6caca; background: #fffdf8; }
        .raffle-panel input:focus { border-color: #c4932e; box-shadow: 0 0 0 3px rgba(212,156,40,.18); }
        .raffle-query-button { margin-top: 13px; background: #7f1d2d; }
        .raffle-count-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(130px, .72fr);
            gap: 12px;
            align-items: stretch;
            margin-top: 16px;
        }
        .raffle-count-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 76px;
            padding: 13px 16px;
            border: 1px solid #f1c56f;
            border-radius: 14px;
            background: linear-gradient(135deg, #fff6d8, #ffe6a3);
        }
        .raffle-count-label { color: #875326; font-size: 13px; }
        .raffle-count-number { color: #a41427; font-size: 34px; line-height: 1; font-weight: 950; }
        .raffle-count-unit { margin-left: 3px; color: #875326; font-weight: 700; }
        .raffle-draw-field { min-width: 0; }
        .raffle-draw-field input { text-align: center; font-size: 22px; font-weight: 900; }
        .raffle-status { min-height: 22px; margin: 12px 0 0; color: #a41427; font-size: 14px; line-height: 1.55; text-align: center; }
        .raffle-status.good { color: #17643a; }
        .raffle-start {
            min-height: 58px;
            margin-top: 4px;
            border: 1px solid #ffe68b;
            border-radius: 999px;
            background: linear-gradient(180deg, #fff09a 0%, #f6bd2e 49%, #d67808 100%);
            color: #701429;
            font-size: 20px;
            font-weight: 950;
            letter-spacing: .12em;
            text-shadow: 0 1px rgba(255,255,255,.7);
            box-shadow: 0 5px 0 #8c280e, 0 9px 20px rgba(95,13,25,.28);
        }
        .raffle-start:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 #8c280e, 0 5px 12px rgba(95,13,25,.25); }
        .rolling-panel { display: none; background: linear-gradient(150deg, #230713, #4f081b); color: #fff; text-align: center; }
        .rolling-panel.active { display: block; animation: panelIn .35s ease both; }
        .rolling-caption { color: #f9d46e; font-size: 13px; font-weight: 800; letter-spacing: .18em; }
        .rolling-board {
            min-height: 104px;
            display: grid;
            place-items: center;
            margin-top: 12px;
            padding: 16px;
            border: 2px solid #f7c94a;
            border-radius: 16px;
            background: radial-gradient(circle, rgba(190,29,57,.8), #2b0713 72%);
            color: #fff6c7;
            font-size: clamp(24px, 8vw, 42px);
            font-weight: 950;
            text-shadow: 0 0 16px #ffba4d;
            box-shadow: inset 0 0 32px rgba(0,0,0,.55), 0 0 24px rgba(241,176,40,.28);
        }
        .rolling-board.spinning { animation: boardPulse .25s ease-in-out infinite alternate; }
        .winner-panel { display: none; position: relative; }
        .winner-panel.active { display: block; animation: panelIn .45s ease both; }
        .winner-heading { text-align: center; margin-bottom: 15px; }
        .winner-heading h2 { margin: 0; color: #8f1629; font-size: 25px; }
        .winner-heading p { margin: 6px 0 0; color: #7c5b61; font-size: 13px; }
        .winner-list { display: grid; gap: 10px; }
        .winner-card {
            display: grid;
            grid-template-columns: 44px minmax(0, 1fr);
            gap: 12px;
            align-items: center;
            padding: 13px;
            border: 1px solid #efd29a;
            border-radius: 14px;
            background: linear-gradient(135deg, #fffef9, #fff2d2);
            opacity: 0;
            transform: translateY(12px) scale(.98);
            animation: winnerIn .42s ease forwards;
        }
        .winner-rank {
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: linear-gradient(145deg, #ffea88, #d49313);
            color: #741526;
            font-size: 17px;
            font-weight: 950;
            box-shadow: 0 3px 0 #9d5a0a;
        }
        .winner-agent { color: #8f1629; font-size: 17px; font-weight: 900; }
        .winner-private { margin-top: 3px; color: #5f4147; font-size: 14px; line-height: 1.55; }
        .winner-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
        .winner-actions button { background: #7f1d2d; }
        .winner-actions button.secondary { background: #735f54; }
        .raffle-privacy { margin: 17px auto 0; max-width: 620px; color: #d9b7bd; font-size: 12px; line-height: 1.6; text-align: center; }
        .confetti { position: absolute; inset: -20px 0 auto; height: 180px; overflow: hidden; pointer-events: none; }
        .confetti i {
            position: absolute;
            top: -20px;
            width: 8px;
            height: 14px;
            border-radius: 2px;
            background: var(--confetti-color, #f8c43a);
            animation: confettiFall 2.4s ease-in infinite;
            animation-delay: var(--confetti-delay, 0s);
            left: var(--confetti-left, 50%);
            transform: rotate(var(--confetti-turn, 15deg));
        }
        @keyframes panelIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
        @keyframes boardPulse { to { transform: scale(1.015); filter: brightness(1.18); } }
        @keyframes winnerIn { to { opacity: 1; transform: none; } }
        @keyframes confettiFall { to { top: 190px; transform: translateX(28px) rotate(480deg); } }
        @media (max-width: 480px) {
            .raffle-stage { min-height: 326px; padding-left: 15px; padding-right: 15px; }
            .raffle-stage::before, .raffle-stage::after { width: 39%; }
            .raffle-content { padding-left: 10px; padding-right: 10px; }
            .raffle-panel { padding: 17px 14px; border-radius: 17px; }
            .raffle-date-grid { grid-template-columns: 1fr; }
            .raffle-count-row { grid-template-columns: 1fr 124px; }
            .raffle-count-number { font-size: 30px; }
            .winner-actions { grid-template-columns: 1fr; }
        }
        @media (min-width: 781px) {
            body.raffle-mode { padding: 24px; }
            .raffle-mode .shell { min-height: calc(100vh - 48px); border-radius: 28px; box-shadow: 0 24px 70px rgba(0,0,0,.52); }
            .raffle-mode .view { min-height: calc(100vh - 48px); }
        }
        @media (prefers-reduced-motion: reduce) {
            .rolling-board.spinning, .winner-card, .confetti i { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
        }
    </style>
</head>
<body>
    <main class="shell">
        <header class="header">
            <h1 id="page-title">團隊服務系統</h1>
        </header>
        <section id="app-view" class="view" aria-live="polite" aria-busy="true">
            <div class="loading">
                <div class="spinner" aria-hidden="true"></div>
                <div>正在連結 LINE 並驗證身分…</div>
            </div>
        </section>
    </main>

    <script>
        const APP_CONFIG = {
            liffId: '2012296409-44VyOp2g',
            apiUrl: 'https://script.google.com/macros/s/AKfycbznYF9UXdxTYQQJPdDFYFXjX8el0UuK0iXKYNsGMEZKyzOZmRSs8ByISAfipOQs0dKe/exec'
        };

        let liffIdToken = '';
        let preparedShareMessages = [];
        let surveyTemplateSharePrefetch = null;
        let shareLoadInProgress = false;
        let sharePickerInProgress = false;
        const SHARE_CACHE_PREFIX = 'public-share-cards-v2:';
        const SHARE_CACHE_MAX_AGE_MS = 24 * 60 * 60 * 1000;
        const SHARE_CACHE_LIMIT = 10;
        const SHARE_CACHE_MAX_LENGTH = 200000;
        const SHARE_READ_TIMEOUT_MS = 45000;
        const SHARE_SLOW_NOTICE_MS = 20000;
        const SHARE_READ_ACTIONS = ['getDigitalCardShareMessages', 'getBusinessToolShareMessages', 'getSurveyTemplateShareMessages'];
        const SHARE_PAGES = {
            shareCard: { title: '數位名片轉分享', action: SHARE_READ_ACTIONS[0] },
            shareBusinessTool: { title: '互動小工具轉分享', action: SHARE_READ_ACTIONS[1] },
            shareSurveyTemplate: { title: '問卷模版轉分享', action: SHARE_READ_ACTIONS[2] }
        };
        const shareState = {
            lineReady: false, started: false, stopped: false, autoPending: true,
            generation: 0, controller: null, result: null, savedAt: 0,
            fromCache: false, pendingUpdate: null, notice: '', status: '', expiryTimer: 0
        };
        let raffleRefreshTimer = 0;
        const raffleState = {
            context: null,
            candidates: [],
            availableCount: 0,
            drawing: false,
            preview: false,
            requestNumber: 0
        };

        document.addEventListener('DOMContentLoaded', initLiffApp);

        // Run before the deferred LIFF SDK has finished downloading. No personal data is fetched here.
        prepareSharePageShell();

        function prepareSharePageShell() {
            const page = requestedParam('page');
            const titles = { shareCard: '數位名片轉分享', shareBusinessTool: '互動小工具轉分享', shareSurveyTemplate: '問卷模版轉分享' };
            if (!titles[page]) return;
            setTitle(titles[page]);
            renderShareLoading('正在連結 LINE…');
            if (isApiConfigured()) {
                try {
                    const hint = document.createElement('link');
                    hint.rel = 'preconnect';
                    hint.href = new URL(APP_CONFIG.apiUrl).origin;
                    hint.crossOrigin = 'anonymous';
                    document.head.appendChild(hint);
                } catch (error) { /* Invalid URL is reported by the normal loading flow. */ }
                if (page === 'shareSurveyTemplate') beginSurveyTemplateSharePrefetch();
            }
        }

        function renderShareLoading(message) {
            setView('<div class="stack">' +
                '<div class="notice share-summary"><div class="notice-title">準備轉分享</div>' +
                '<div class="muted">準備好後會自動開啟 LINE 好友名單；請選擇要分享的好友或群組。</div></div>' +
                '<div id="share-load-status" class="status neutral" role="status">' + escapeHtml(message) + '</div>' +
                '<button type="button" class="share" disabled>資料準備中，請稍候…</button></div>', true);
        }

        function shareCacheKey() {
            return SHARE_CACHE_PREFIX + JSON.stringify([APP_CONFIG.apiUrl, APP_CONFIG.liffId]);
        }

        function currentShareId() {
            const page = requestedParam('page');
            if (!SHARE_PAGES[page]) return '';
            return JSON.stringify([page, page === 'shareSurveyTemplate' ? '' : requestedParam('memberKey'),
                page === 'shareBusinessTool' ? requestedParam('toolKey') : '']);
        }

        function shareCacheIsCurrent(savedAt) {
            const age = Date.now() - savedAt;
            return Number.isFinite(savedAt) && savedAt > 0 && age >= 0 && age < SHARE_CACHE_MAX_AGE_MS;
        }

        function shareDataError(message) {
            const error = new Error(message);
            error.definitive = true;
            return error;
        }

        function validShareUri(value, httpsOnly = false) {
            if (typeof value !== 'string' || value.length > 8000) return false;
            try {
                const url = new URL(value);
                return !url.username && !url.password &&
                    (httpsOnly ? url.protocol === 'https:' : ['https:', 'http:', 'tel:', 'line:'].includes(url.protocol));
            } catch (error) { return false; }
        }

        function normalizeShareResult(result, page = requestedParam('page')) {
            // Only public share-card fields are allowed in storage, never an API response/token wholesale.
            if (!result || !Array.isArray(result.messages) || !result.messages.length || result.messages.length > 5) {
                throw shareDataError('目前沒有可分享的卡片。');
            }
            if (JSON.stringify(result.messages).length > SHARE_CACHE_MAX_LENGTH) throw shareDataError('卡片內容過大，請聯絡管理者。');
            let nodes = 0;
            function visit(value, depth) {
                if (depth > 24 || ++nodes > 10000) throw shareDataError('卡片格式不正確。');
                if (!value || typeof value !== 'object') return;
                if (value.action && (value.action.type !== 'uri' || !validShareUri(value.action.uri))) {
                    throw shareDataError('卡片含有不支援的分享動作。');
                }
                if (value.type === 'image' && !validShareUri(value.url, true)) throw shareDataError('卡片圖片網址不正確。');
                Object.values(value).forEach(child => visit(child, depth + 1));
            }
            for (const message of result.messages) {
                const content = message && message.contents;
                if (!message || message.type !== 'flex' || typeof message.altText !== 'string' ||
                    !message.altText.trim() || message.altText.length > 400 || !content ||
                    !['bubble', 'carousel'].includes(content.type)) throw shareDataError('卡片格式不正確。');
                const bubbles = content.type === 'bubble' ? [content] : content.contents;
                if (!Array.isArray(bubbles) || !bubbles.length || bubbles.length > 12 ||
                    bubbles.some(bubble => !bubble || bubble.type !== 'bubble')) throw shareDataError('卡片頁數不正確。');
                visit(content, 0);
            }
            if (page === 'shareBusinessTool' && (result.messages.length !== 1 || !validShareUri(result.toolUrl, true))) {
                throw shareDataError('目前無法取得可分享的工具卡片。');
            }
            return {
                memberName: String(result.memberName || '').slice(0, 120),
                toolTitle: String(result.toolTitle || '').slice(0, 120),
                toolUrl: page === 'shareBusinessTool' ? result.toolUrl : '',
                templateTitle: String(result.templateTitle || '').slice(0, 120),
                messages: JSON.parse(JSON.stringify(result.messages))
            };
        }

        function readShareCacheEntries() {
            try {
                const raw = localStorage.getItem(shareCacheKey()) || '[]';
                if (raw.length > SHARE_CACHE_MAX_LENGTH * SHARE_CACHE_LIMIT + 20000) return [];
                const entries = JSON.parse(raw);
                if (!Array.isArray(entries)) return [];
                return entries.filter(entry => entry && typeof entry.key === 'string' &&
                    entry.key.length <= 2000 && shareCacheIsCurrent(entry.savedAt)).slice(0, SHARE_CACHE_LIMIT);
            } catch (error) { return []; }
        }

        function clearShareCardCache() {
            try {
                localStorage.setItem(shareCacheKey(), JSON.stringify(readShareCacheEntries().filter(entry => entry.key !== currentShareId())));
            } catch (error) { /* Optional storage must not prevent sharing. */ }
        }

        function readShareCardCache() {
            const entry = readShareCacheEntries().find(item => item.key === currentShareId());
            if (!entry) return null;
            try {
                return { result: normalizeShareResult(entry.result), savedAt: entry.savedAt, fromCache: true };
            } catch (error) {
                clearShareCardCache();
                return null;
            }
        }

        function writeShareCardCache(result, savedAt) {
            const entry = { key: currentShareId(), savedAt, result: normalizeShareResult(result) };
            try {
                const entries = [entry, ...readShareCacheEntries().filter(item => item.key !== entry.key)].slice(0, SHARE_CACHE_LIMIT);
                localStorage.setItem(shareCacheKey(), JSON.stringify(entries));
            } catch (error) { /* Private mode/quota failure: continue using the fresh response in memory. */ }
        }

        function clearLegacyShareCaches() {
            // These old formats are not reused as trusted card data.
            try {
                for (const prefix of ['share-labels-v1:', 'survey-template-share-v1:']) {
                    localStorage.removeItem(prefix + APP_CONFIG.apiUrl + ':' + APP_CONFIG.liffId);
                }
            } catch (error) { /* Storage may be disabled. */ }
        }

                    '</div><button id="share-refresh-button" type="button" onclick="refreshSharePage()">重新載入卡片</button></div>');

            setView('<div class="stack">' +

                '<div class="muted">' + (tool ? escapeHtml((result.memberName || '服務人員') + '提供的互動小工具。') : '') +
                '分享時請選擇 LINE 好友或群組。</div>' +

                '<button id="share-card-button" type="button" class="share" onclick="sharePreparedMessages()">' +
                (shareState.status === '內容已送出。' ? '再次分享' : '選擇分享對象') + '</button>' +
                '<div id="share-status" class="status neutral" role="status">' + escapeHtml(shareState.status || (shareState.autoPending ? '準備開啟 LINE 好友名單…' : '卡片已準備完成，請選擇分享對象。')) + '</div>' +
                '<div id="share-cache-notice" class="muted">' + escapeHtml(shareState.notice) + '</div>' +
                '<button id="share-refresh-button" class="share-secondary" type="button" onclick="refreshSharePage()">更新卡片資料</button>' +

        function applyShareUpdate(update) {
            if (sharePickerInProgress) {
                // Do not replace the snapshot underneath an open LINE picker.
                shareState.pendingUpdate = update;
                return;
            }
            clearTimeout(shareState.expiryTimer);
            if (update.error) {
                shareState.result = null;
                shareState.savedAt = 0;
                preparedShareMessages = [];
                shareState.autoPending = false;
                shareState.notice = errorText(update.error);
            } else {
                shareState.result = update.result;
                shareState.savedAt = update.savedAt;
                shareState.fromCache = Boolean(update.fromCache);
                preparedShareMessages = update.result.messages;
                shareState.notice = update.fromCache
                    ? '已使用此裝置 24 小時內的卡片快取，正在背景更新；如需最新內容，請按「更新卡片資料」。'
                    : '已取得最新卡片資料。';
                shareState.expiryTimer = setTimeout(expireShareCard, Math.max(1, SHARE_CACHE_MAX_AGE_MS - (Date.now() - update.savedAt)));
            }
            renderShareView();
        }

        function expireShareCard() {
            if (!shareState.result || shareCacheIsCurrent(shareState.savedAt)) return;
            clearShareCardCache();
            applyShareUpdate({ error: shareDataError('卡片快取已到期，請重新載入最新資料。') });
        }

        function maybeAutoShare() {
            if (!shareState.autoPending || !shareState.lineReady || shareState.stopped ||
                document.hidden || !shareState.result || sharePickerInProgress) return;
            shareState.autoPending = false;
            void sharePreparedMessages();
        }

        async function initLiffApp() {
            if (location.protocol === 'file:' && requestedParam('page') === 'raffle' && requestedParam('preview') === '1') {
                renderRafflePreview();
                return;
            }
            if (!isApiConfigured()) {
                renderError('尚未設定 Apps Script Web App URL。');
                return;
            }
            if (!APP_CONFIG.liffId || APP_CONFIG.liffId.indexOf('PASTE_') === 0) {
                renderError('尚未設定 LIFF ID。');
                return;
            }
            if (typeof liff === 'undefined') {
                renderError('LINE LIFF SDK 載入失敗，請重新開啟頁面。');
                return;
            }

            try {
                // 公開的問卷模板卡不含個資，可在 LIFF 初始化同時預先讀取，縮短等待時間。
                if (requestedParam('page') === 'shareSurveyTemplate') {
                    beginSurveyTemplateSharePrefetch();
                }
                await liff.init({ liffId: APP_CONFIG.liffId });

                if (!liff.isLoggedIn()) {
                    liff.login({ redirectUri: location.href });
                    return;
                }

                liffIdToken = liff.getIDToken();
                if (!liffIdToken) {
                    throw new Error('無法取得 LINE ID Token，請確認 LIFF 已啟用 openid scope。');
                }

                shareState.lineReady = true;

                // LIFF 會在 init() 完成後還原附加的 page/memberKey 參數，因此此時才讀取網址。
                const page = requestedParam('page') || 'verify';
                if (page === 'verify') {
                    await renderTeamVerification();
                    return;
                }
                if (page === 'shareCard') {
                    await renderDigitalCardShare();
                    return;
                }
                if (page === 'shareSurveyTemplate') {
                    await renderSurveyTemplateShare();
                    return;
                }
                if (page === 'shareBusinessTool') {
                    await renderBusinessToolShare();
                    return;
                }
                if (page === 'raffle') {
                    await renderRaffle();
                    return;
                }
                throw new Error('不支援的 LIFF 頁面。');
            } catch (error) {
                renderError(errorText(error));
            }
        }

        function requestedParam(name) {
            const params = new URLSearchParams(location.search);
            const directValue = params.get(name);
            if (directValue) return directValue;

            const liffState = params.get('liff.state');
            if (!liffState) return '';
            const questionIndex = liffState.indexOf('?');
            const query = questionIndex >= 0
                ? liffState.substring(questionIndex + 1)
                : liffState.replace(/^\/?/, '');
            return new URLSearchParams(query).get(name) || '';
        }

        function startSharePage(page) {
            if (page !== requestedParam('page') || shareState.started || !shareState.lineReady) return;
            setTitle(SHARE_PAGES[page].title);
            if (page === 'shareCard' && !requestedParam('memberKey')) {
                renderError('缺少團隊成員名片識別資訊。');
                return;
            }
            if (page === 'shareBusinessTool' && (!requestedParam('memberKey') || !requestedParam('toolKey'))) {
                renderError('缺少工具卡片資訊，請從 LINE 卡片上的「轉分享」重新開啟。');
                return;
            }
            shareState.started = true;
            clearLegacyShareCaches();
            const cached = readShareCardCache();
            if (cached) applyShareUpdate(cached);
            // Cached public cards can open the picker without waiting for another Sheets round trip.
            const loading = loadShareData();
            maybeAutoShare();
            return loading;
        }

        function beginSurveyTemplateSharePrefetch() {
            if (!surveyTemplateSharePrefetch) {
                const controller = new AbortController();
                surveyTemplateSharePrefetch = {
                    controller,
                    promise: secureApi('getSurveyTemplateShareMessages', {}, SHARE_READ_TIMEOUT_MS, controller.signal)
                        .then(result => ({ result }), error => ({ error }))
                };
            }
            return surveyTemplateSharePrefetch;
        }

        async function loadShareData() {
            if (shareLoadInProgress || shareState.stopped || !shareState.lineReady) return;
            const page = requestedParam('page');
            if (!SHARE_PAGES[page]) return;
            const generation = ++shareState.generation;
            shareLoadInProgress = true;
            if (!sharePickerInProgress) renderShareView();
            let request;
            if (page === 'shareSurveyTemplate') {
                request = beginSurveyTemplateSharePrefetch();
                surveyTemplateSharePrefetch = null;
            } else {
                const controller = new AbortController();
                request = {
                    controller,
                    promise: secureApi(SHARE_PAGES[page].action, {
                        idToken: liffIdToken, memberKey: requestedParam('memberKey'),
                        ...(page === 'shareBusinessTool' ? { toolKey: requestedParam('toolKey') } : {})
                    }, SHARE_READ_TIMEOUT_MS, controller.signal).then(result => ({ result }), error => ({ error }))
                };
            }
            shareState.controller = request.controller;
            const outcome = await request.promise;
            if (generation !== shareState.generation || shareState.stopped) return;
            shareLoadInProgress = false;
            shareState.controller = null;
            try {
                if (outcome.error) throw outcome.error;
                const result = normalizeShareResult(outcome.result);
                const savedAt = Date.now();
                writeShareCardCache(result, savedAt);
                applyShareUpdate({ result, savedAt, fromCache: false });
                maybeAutoShare();
            } catch (error) {
                if (error.definitive) {
                    // A deletion, invalid key or rejected identity must not resurrect old cached data.
                    clearShareCardCache();
                    shareState.autoPending = false;
                }
                if (!error.definitive && shareState.result && shareCacheIsCurrent(shareState.savedAt)) {
                    shareState.notice = '暫時無法更新，仍可分享此裝置 24 小時內的卡片；稍後可按「更新卡片資料」。';
                    if (!sharePickerInProgress) renderShareView();
                } else {
                    applyShareUpdate({ error });
                }
            }
        }

        function refreshSharePage() {
            if (!shareState.started || sharePickerInProgress || shareLoadInProgress || shareState.stopped) return;
            // A refresh is deliberate; it must not unexpectedly reopen the picker.
            shareState.autoPending = false;
            shareState.result = null;
            shareState.savedAt = 0;
            shareState.pendingUpdate = null;
            shareState.status = '';
            preparedShareMessages = [];
            clearTimeout(shareState.expiryTimer);
            clearShareCardCache();
            return loadShareData();
        }

        document.addEventListener('visibilitychange', () => {
            if (document.hidden || !shareState.started || shareState.stopped) return;
            expireShareCard();
            maybeAutoShare();
        });

        window.addEventListener('pagehide', () => {
            if (!SHARE_PAGES[requestedParam('page')]) return;
            shareState.stopped = true;
            shareState.autoPending = false;
            shareState.generation++;
            if (shareState.controller) shareState.controller.abort();
            if (surveyTemplateSharePrefetch) surveyTemplateSharePrefetch.controller.abort();
            surveyTemplateSharePrefetch = null;
            shareLoadInProgress = false;
            clearTimeout(shareState.expiryTimer);
        });

        window.addEventListener('pageshow', event => {
            if (!event.persisted || !SHARE_PAGES[requestedParam('page')] || !shareState.stopped) return;
            shareState.stopped = false;
            if (!shareState.started) {
                if (shareState.lineReady) void startSharePage(requestedParam('page'));
                return;
            }
            expireShareCard();
            if (!sharePickerInProgress) {
                renderShareView();
                // BFCache restores the existing page but never auto-shares again.
                void loadShareData();
            }
        });

            const endInput = document.getElementById('raffle-end-date');

            const startDate = startInput.value;
            const endDate = endInput.value;
            if (!startDate || !endDate) {
                setRaffleStatus('請選擇完整的開始日期與結束日期。');
                return false;
            }
            if (startDate > endDate) {
                setRaffleStatus('開始日期不能晚於結束日期。');
                return false;
            }

            const requestNumber = ++raffleState.requestNumber;
            const queryButton = document.getElementById('raffle-query-button');
            if (queryButton) {
                queryButton.disabled = true;
                queryButton.textContent = '正在計算…';
            }
            setRaffleStatus('正在讀取此日期區間的問卷…', true);
            try {
                let result;
                if (raffleState.preview) {
                    result = {
                        availableCount: raffleState.candidates.length,
                        maxDrawCount: raffleState.candidates.length,
                        candidates: raffleState.candidates
                    };
                } else {
                    result = await secureApi('getRaffleCandidates', {
                        idToken: liffIdToken,
                        startDate,
                        endDate
                    });
                }
                if (requestNumber !== raffleState.requestNumber) return false;
                raffleState.startDate = startDate;
                raffleState.endDate = endDate;
                applyRaffleCandidateResult(result);
                return true;
            } catch (error) {
                raffleState.availableCount = 0;
                raffleState.candidates = [];
                updateRaffleCountDisplay();
                setRaffleStatus(errorText(error));
                return false;
            } finally {
                if (queryButton) {
                    queryButton.disabled = false;
                    queryButton.textContent = '重新計算可抽問卷';
                }
            }
        }

        function applyRaffleCandidateResult(result) {
            raffleState.availableCount = Number(result.availableCount || 0);
            raffleState.candidates = Array.isArray(result.candidates) ? result.candidates : [];
            raffleState.maxDrawCount = Number(result.maxDrawCount || 0);
            updateRaffleCountDisplay();
            clearRaffleResults();

            const drawInput = document.getElementById('raffle-draw-count');
            if (drawInput) {
                const safeMax = Math.max(1, raffleState.maxDrawCount || raffleState.availableCount || 1);
                drawInput.max = String(safeMax);
                const current = Number(drawInput.value || 1);
                if (current > safeMax) drawInput.value = String(safeMax);
            }
            if (raffleState.availableCount > 0) {
                setRaffleStatus(`此區間共有 ${raffleState.availableCount} 份問卷可參加抽獎。`, true);
            } else {
                setRaffleStatus('這個日期區間目前沒有可參加抽獎的問卷。');
            }
        }

        function updateRaffleCountDisplay() {
            const count = document.getElementById('raffle-count');
            const startButton = document.getElementById('raffle-start-button');
            if (count) count.textContent = String(raffleState.availableCount || 0);
            if (startButton) startButton.disabled = !raffleState.availableCount || raffleState.drawing;
        }

        function clearRaffleDrawCount(input) {
            input.value = '';
        }

        async function startRaffle(isRedraw) {
            if (raffleState.drawing) return;
            const startDate = document.getElementById('raffle-start-date').value;
            const endDate = document.getElementById('raffle-end-date').value;
            if (raffleState.startDate !== startDate || raffleState.endDate !== endDate) {
                const refreshed = await refreshRaffleCandidates();
                if (!refreshed) return;
            }

            const drawInput = document.getElementById('raffle-draw-count');
            const drawCount = Number(drawInput.value);
            if (!Number.isInteger(drawCount) || drawCount < 1) {
                setRaffleStatus('請輸入正確的抽獎份數。');
                drawInput.focus();
                return;
            }
            if (drawCount > raffleState.availableCount) {
                setRaffleStatus(`目前只有 ${raffleState.availableCount} 份問卷，無法抽出 ${drawCount} 份。`);
                drawInput.focus();
                return;
            }
            if (raffleState.maxDrawCount && drawCount > raffleState.maxDrawCount) {
                setRaffleStatus(`每次最多可抽 ${raffleState.maxDrawCount} 份，請調整抽獎份數。`);
                drawInput.focus();
                return;
            }

            raffleState.drawing = true;
            setRaffleControlsDisabled(true);
            clearRaffleResults();
            setRaffleStatus(isRedraw ? '正在重新抽出幸運問卷…' : '抽獎進行中，祝大家幸運！', true);
            const rollingPanel = document.getElementById('rolling-panel');
            const rollingBoard = document.getElementById('rolling-board');
            rollingPanel.classList.add('active');
            rollingBoard.classList.add('spinning');
            rollingPanel.scrollIntoView({ behavior: prefersReducedMotion() ? 'auto' : 'smooth', block: 'center' });

            try {
                const drawRequest = raffleState.preview
                    ? Promise.resolve(buildPreviewDrawResult(drawCount, startDate, endDate))
                    : secureApi('drawRaffle', {
                        idToken: liffIdToken,
                        startDate,
                        endDate,
                        drawCount
                    });
                const [result] = await Promise.all([drawRequest, runRollingAnimation()]);
                rollingBoard.classList.remove('spinning');
                rollingBoard.textContent = '幸運名單出爐！';
                showRaffleWinners(result);
                setRaffleStatus(`已從 ${result.availableCount} 份問卷中抽出 ${result.drawCount} 份。`, true);
            } catch (error) {
                rollingBoard.classList.remove('spinning');
                rollingBoard.textContent = '抽獎未完成';
                setRaffleStatus(errorText(error));
            } finally {
                raffleState.drawing = false;
                setRaffleControlsDisabled(false);
                updateRaffleCountDisplay();
            }
        }

        function runRollingAnimation() {
            const board = document.getElementById('rolling-board');
            const candidates = raffleState.candidates.length ? raffleState.candidates : [{ maskedCustomerName: '幸運問卷', agentName: '抽獎中' }];
            if (prefersReducedMotion()) {
                board.textContent = candidates[0].maskedCustomerName;
                return new Promise(resolve => setTimeout(resolve, 160));
            }
            return new Promise(resolve => {
                let index = 0;
                const interval = setInterval(() => {
                    const candidate = candidates[index % candidates.length];
                    board.textContent = `${candidate.maskedCustomerName}｜${candidate.agentName}`;
                    index += 1 + Math.floor(Math.random() * Math.min(5, candidates.length));
                }, 76);
                setTimeout(() => {
                    clearInterval(interval);
                    resolve();
                }, 2600);
            });
        }

        function buildPreviewDrawResult(drawCount, startDate, endDate) {
            const shuffled = raffleState.candidates.slice();
            for (let index = shuffled.length - 1; index > 0; index -= 1) {
                const swapIndex = Math.floor(Math.random() * (index + 1));
                [shuffled[index], shuffled[swapIndex]] = [shuffled[swapIndex], shuffled[index]];
            }
            return {
                availableCount: raffleState.availableCount,
                drawCount,
                startDate,
                endDate,
                drawnAt: '2026-08-31 16:30:00',
                winners: shuffled.slice(0, drawCount)
            };
        }

        function showRaffleWinners(result) {
            const panel = document.getElementById('winner-panel');
            const winners = Array.isArray(result.winners) ? result.winners : [];
            const confettiColors = ['#f6c84b', '#e83555', '#58c8be', '#ffffff'];
            const confetti = Array.from({ length: 28 }, (_, index) => {
                const left = (index * 37) % 100;
                const delay = ((index * 13) % 20) / 10;
                const turn = (index * 29) % 180;
                return `<i style="--confetti-left:${left}%;--confetti-delay:${delay}s;--confetti-turn:${turn}deg;--confetti-color:${confettiColors[index % confettiColors.length]}"></i>`;
            }).join('');
            const winnerCards = winners.map((winner, index) => `
                <article class="winner-card" style="animation-delay:${Math.min(index * .08, 1.2)}s">
                    <div class="winner-rank">${index + 1}</div>
                    <div>
                        <div class="winner-agent">服務人員｜${escapeHtml(winner.agentName || '未提供')}</div>
                        <div class="winner-private">客戶姓名｜${escapeHtml(winner.maskedCustomerName || '未提供')}<br>手機號碼｜${escapeHtml(winner.maskedPhone || '未提供')}</div>
                    </div>
                </article>
            `).join('');
            panel.innerHTML = `
                <div class="confetti" aria-hidden="true">${confetti}</div>
                <div class="winner-heading">
                    <h2>🏆 恭喜中獎</h2>
                    <p>${escapeHtml(result.startDate || '')} ～ ${escapeHtml(result.endDate || '')}｜抽獎時間 ${escapeHtml(result.drawnAt || '')}</p>
                </div>
                <div class="winner-list">${winnerCards}</div>
                <div class="winner-actions">
                    <button type="button" onclick="startRaffle(true)">重新抽獎</button>
                    <button type="button" class="secondary" onclick="scrollToRaffleControls()">調整日期或份數</button>
                </div>
            `;
            panel.classList.add('active');
            setTimeout(() => panel.scrollIntoView({ behavior: prefersReducedMotion() ? 'auto' : 'smooth', block: 'start' }), 220);
        }

        function clearRaffleResults() {
            const rollingPanel = document.getElementById('rolling-panel');
            const winnerPanel = document.getElementById('winner-panel');
            if (rollingPanel) rollingPanel.classList.remove('active');
            if (winnerPanel) {
                winnerPanel.classList.remove('active');
                winnerPanel.innerHTML = '';
            }
        }

        function setRaffleControlsDisabled(disabled) {
            document.querySelectorAll('[data-raffle-control]').forEach(control => {
                control.disabled = disabled;
            });
        }

        function setRaffleStatus(message, good) {
            const status = document.getElementById('raffle-status');
            if (!status) return;
            status.textContent = message || '';
            status.classList.toggle('good', Boolean(good));
        }

        function scrollToRaffleControls() {
            document.getElementById('raffle-controls').scrollIntoView({ behavior: prefersReducedMotion() ? 'auto' : 'smooth', block: 'start' });
        }

        function prefersReducedMotion() {
            return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        }

        async function sharePreparedMessages() {
            if (!shareState.lineReady || sharePickerInProgress || shareState.stopped || document.hidden) return;
            const button = document.getElementById('share-card-button');
            if (!button || button.disabled || !preparedShareMessages.length) return;
            shareState.autoPending = false;
            expireShareCard();
            if (!shareState.result) return;
            // A pending background update never changes what the open picker is sending.
            const snapshot = JSON.parse(JSON.stringify(preparedShareMessages));
            try {
                if (!liff.isApiAvailable('shareTargetPicker')) {
                    throw new Error('此環境無法使用分享選擇器，請用 LINE 開啟此頁並確認 LIFF 已啟用分享功能。');
                }
                sharePickerInProgress = true;
                button.disabled = true;
                button.textContent = '正在開啟 LINE 好友名單…';
                const refresh = document.getElementById('share-refresh-button');
                if (refresh) refresh.disabled = true;
                const result = await liff.shareTargetPicker(snapshot, { isMultiple: true });
                shareState.status = result && result.status === 'success'
                    ? '內容已送出。' : '已取消分享，內容尚未送出；需要時可再次選擇分享對象。';
            } catch (error) {
                shareState.status = '未能開啟或完成分享，請按「選擇分享對象」重試。' + errorText(error);
            } finally {
                sharePickerInProgress = false;
                if (!shareState.stopped) {
                    const pending = shareState.pendingUpdate;
                    shareState.pendingUpdate = null;
                    if (pending) applyShareUpdate(pending);
                    expireShareCard();
                    renderShareView();
                }
            }
        }

        async function secureApi(action, payload, timeoutMs, externalSignal) {
            const controller = timeoutMs || externalSignal ? new AbortController() : null;
            const cancel = () => controller && controller.abort();
            if (externalSignal) {
                externalSignal.addEventListener('abort', cancel, { once: true });
                if (externalSignal.aborted) cancel();
            }
            const timeoutId = controller && timeoutMs ? setTimeout(cancel, timeoutMs) : null;
            const slowNoticeId = SHARE_READ_ACTIONS.includes(action) ? setTimeout(() => {
                const status = document.getElementById('share-load-status');
                if (status) status.textContent = '網路或伺服器回應較慢，仍在載入中，請稍候…';
            }, SHARE_SLOW_NOTICE_MS) : null;
            try {
                const response = await fetch(APP_CONFIG.apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    ...(controller ? { signal: controller.signal } : {}),
                    body: JSON.stringify({ requestType: 'liff-api', action, payload: payload || {} })
                });
                const responseText = await response.text();
                let result;
                try {
                    result = JSON.parse(responseText);
                } catch (error) {
                    if (response.status === 401 || response.status === 403) throw shareDataError('LINE 身分驗證失敗，請重新開啟頁面。');
                    throw new Error('LIFF API 回應格式錯誤，請稍後重試。');
                }
                if (!response.ok || !result || !result.ok) {
                    const error = new Error(result && result.message ? result.message : 'LIFF API 執行失敗。');
                    // Transport/server failures may retain unexpired PUBLIC cards, but denials may not.
                    error.definitive = response.status === 401 || response.status === 403 ||
                        (response.ok && result && result.ok === false);
                    throw error;
                }
                return result;
            } catch (error) {
                if (error.name === 'AbortError') throw new Error('連線逾時，暫時無法取得最新資料，請重新載入後再試一次。');
                throw error;
            } finally {
                if (timeoutId !== null) clearTimeout(timeoutId);
                if (slowNoticeId !== null) clearTimeout(slowNoticeId);
                if (externalSignal) externalSignal.removeEventListener('abort', cancel);
            }
        }

        function setTitle(text) {
            document.getElementById('page-title').textContent = text;
            document.title = text;
        }

        function setLoading(text) {
            setView(`<div class="loading"><div class="spinner" aria-hidden="true"></div><div>${escapeHtml(text)}</div></div>`, true);
        }

        function setView(html, busy) {
            const view = document.getElementById('app-view');
            view.innerHTML = html;
            view.setAttribute('aria-busy', busy ? 'true' : 'false');
        }

        function renderError(message) {
            preparedShareMessages = [];
            shareState.autoPending = false;
            setView(`<div class="stack"><div class="notice error">${escapeHtml(message || '發生錯誤。')}</div>
                ${SHARE_PAGES[requestedParam('page')] ? '<button type="button" onclick="location.reload()">重新開啟頁面</button>' : ''}</div>`);
        }

        function closeLiffWindow() {
            if (typeof liff !== 'undefined' && liff.isInClient()) {
                liff.closeWindow();
                return;
            }
            window.close();
        }

        function isApiConfigured() {
            return APP_CONFIG.apiUrl && APP_CONFIG.apiUrl.indexOf('PASTE_') !== 0;
        }

        function escapeHtml(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function errorText(error) {
            return error && error.message ? error.message : String(error || '發生錯誤。');
        }
    </script>
</body>
</html>
